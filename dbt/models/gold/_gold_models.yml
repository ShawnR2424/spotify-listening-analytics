version: 2

models:

  - name: fct_listening_events
    description: >
      One row per unique Spotify listening event.

    columns:

      - name: listening_event_id
        description: Deterministic identifier for a unique track play.
        data_tests:
          - not_null
          - unique

      - name: played_at
        description: Timestamp when the track was played.
        data_tests:
          - not_null

      - name: track_id
        description: Spotify track identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tracks')
                field: track_id

      - name: album_id
        description: Spotify album identifier.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_albums')
                field: album_id


  - name: dim_tracks
    description: >
      One row per unique Spotify track.

    columns:

      - name: track_id
        description: Spotify identifier for the track.
        data_tests:
          - not_null
          - unique

      - name: album_id
        description: Album associated with the track.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_albums')
                field: album_id


  - name: dim_albums
    description: >
      One row per unique Spotify album.

    columns:

      - name: album_id
        description: Spotify identifier for the album.
        data_tests:
          - not_null
          - unique


  - name: dim_artists
    description: >
      One row per unique Spotify artist.

    columns:

      - name: artist_id
        description: Spotify identifier for the artist.
        data_tests:
          - not_null
          - unique


  - name: bridge_track_artists
    description: >
      Many-to-many bridge between Spotify tracks and artists.

    columns:

      - name: track_artist_key
        description: Deterministic identifier for a track and artist relationship.
        data_tests:
          - not_null
          - unique

      - name: track_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tracks')
                field: track_id

      - name: artist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_artists')
                field: artist_id